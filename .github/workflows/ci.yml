name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
          
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/guru-playmaster/my-cicd-project:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/guru-playmaster/my-cicd-project:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/guru-playmaster/my-cicd-project:latest"

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u guru-playmaster --password-stdin

            echo "=== Pulling latest image ==="
            docker pull $IMAGE

            echo "=== Saving current image for rollback ==="
            OLD_IMAGE=$(docker inspect --format='{{.Image}}' my-cicd-app 2>/dev/null || echo "")

            if [ -n "$OLD_IMAGE" ]; then
             docker tag "$OLD_IMAGE" my-cicd-app:rollback
            fi
            echo "Current image: $OLD_IMAGE"

            echo "=== Removing old container ==="
            docker rm -f my-cicd-app || true

            echo "=== Starting new container ==="
            docker run -d \
              --name my-cicd-app \
              --restart unless-stopped \
              -p 5000:5000 \
              $IMAGE

            echo "=== Waiting for health check ==="

            for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' my-cicd-app)

            echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 5
            done

              if [ "$STATUS" = "healthy" ]; then
              echo "=== Deployment successful ==="
              docker ps
            else
              echo "=== Deployment failed — rolling back ==="

              docker logs my-cicd-app || true
              docker rm -f my-cicd-app || true

              if [ -n "$OLD_IMAGE" ]; then
              echo "=== Starting previous image ==="
              docker run -d \
              --name my-cicd-app \
             --restart unless-stopped \
              -p 5000:5000 \
              my-cicd-app:rollback

                sleep 10
                docker ps
              fi

              exit 1
             fi